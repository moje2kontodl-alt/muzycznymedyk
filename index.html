<style>
:root {
  --cream:#fffaf0;
  --ink:#111;
  --mauve:#9f678b;
  --green:#a5cf8b;
  --blue:#72b8e7;
  --teal:#8fd5d0;
  --pink:#f2b8c9;
  --grey:#818181;
  --band-h:clamp(86px,11.4vh,176px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mauve);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit}
body{overscroll-behavior:none}
.band{
  position:fixed;left:0;width:100%;height:var(--band-h);z-index:100;pointer-events:none;
  background-color:var(--grey);
  background-image:
    radial-gradient(circle at 90px 30px,#fff 0 14px,transparent 15px),
    radial-gradient(circle at 30px 73px,#fff 0 14px,transparent 15px);
  background-size:122px 92px;
  background-repeat:repeat;
}
.band.top{top:0;border-bottom:3px dashed #111}
.band.bottom{bottom:0;border-top:3px dashed #111}
#app{min-height:100vh}
.screen{
  min-height:100dvh;padding:calc(var(--band-h) + 34px) 22px calc(var(--band-h) + 34px);
  background:var(--page-bg,var(--mauve));overflow:auto;
}
.wrap{width:min(940px,100%);margin:0 auto}
.card,.panel,.title-card,.tile,.menu-box,.stage-card{
  position:relative;background:var(--cream);border:3px solid #111;border-radius:26px;
}
.stitched::after,.panel::after,.tile::after,.menu-box::after,.stage-card::after{
  content:"";position:absolute;inset:10px;border:2px dashed #222;border-radius:17px;pointer-events:none
}
.home-logo{width:min(890px,92%);margin:0 auto 36px}
.home-logo img{display:block;width:100%;height:auto;border-radius:24px}
.home-grid{display:grid;gap:46px;width:min(850px,90%);margin:0 auto}
.home-tile{
  min-height:240px;background:var(--cream);border:3px solid #111;border-radius:28px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;cursor:pointer
}
.home-tile::after{content:"";position:absolute;inset:12px;border:2px dashed #111;border-radius:20px;pointer-events:none}
.home-tile .abbr{position:relative;z-index:1;font-size:clamp(54px,8vw,88px);font-weight:1000;line-height:1}
.home-tile .label{position:relative;z-index:1;font-size:clamp(29px,4.8vw,52px);font-weight:900;margin-top:16px;text-align:center}
.backbar{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.back{
  background:linear-gradient(135deg,#fffaf0,#f3c4d1);border:3px solid #111;border-radius:18px;padding:11px 20px;
  font-weight:900;font-size:22px;cursor:pointer
}
.title-card{font-size:clamp(34px,5.8vw,62px);font-weight:1000;text-align:center;padding:22px 26px;margin-bottom:24px}
.menu-box{padding:22px;margin-bottom:22px}
.section-label{
  display:inline-block;position:relative;z-index:2;background:var(--pink);border:2px solid #111;border-radius:13px;
  padding:6px 14px;font-weight:1000;font-size:clamp(22px,3.2vw,34px);margin:-8px 0 10px
}
.menu-row{
  position:relative;z-index:2;width:100%;display:flex;justify-content:space-between;align-items:center;
  background:transparent;border:0;border-bottom:1px solid #cfcfcf;padding:18px 24px;text-align:left;cursor:pointer;
  font-weight:900;font-size:clamp(22px,3.3vw,34px)
}
.menu-row:last-child{border-bottom:0}
.chev{font-size:1.35em}
.panel{padding:26px 28px;margin-bottom:22px}
.panel p,.panel li{position:relative;z-index:2;font-size:clamp(17px,2.25vw,23px);line-height:1.45}
.panel h2{position:relative;z-index:2;margin:4px 0 12px;font-size:clamp(25px,3.6vw,38px)}
.panel h3{position:relative;z-index:2;font-size:clamp(21px,3vw,30px)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative;z-index:2}
.form-card{border:2px dashed #333;border-radius:16px;padding:18px;background:#fff9ee}
.form-card h3{margin-top:0}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mini{border:2px dashed #444;border-radius:13px;padding:14px;text-align:center;background:#fff;font-weight:900}
.method-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative;z-index:2}
.method{background:#f7cfd9;border:2px solid #222;border-radius:12px;padding:13px 10px;text-align:center;font-weight:900}
.bullets{margin:0;padding-left:28px}
.bullets li::marker{color:#e6323f}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-bottom:14px}
.crumb{background:#f4c1ce;border:2px solid #222;border-radius:10px;padding:6px 10px;font-weight:900}
.goals12{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.goal-box{background:#fffaf0;border:2px dashed #333;border-radius:16px;padding:18px;position:relative}
.goal-box h2{text-align:center;margin:0 0 16px}
.goal-flex{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.big-number{font-size:64px;font-weight:1000;background:#eef5e8;border:2px dashed #555;border-radius:12px;display:grid;place-items:center;min-height:100px}
.stack{display:grid;gap:10px}
.stack .mini{background:#fff}
.plus,.or{text-align:center;font-weight:1000;font-size:24px}
.goal-table{position:relative;z-index:2;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:780px;background:#fffaf0}
th,td{border:2px solid #111;padding:10px;text-align:center;vertical-align:middle;font-size:16px}
th{background:#eee5d9}
.goal-stage-grid{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:8px;position:relative;z-index:2}
.goal-stage-grid>div{border:2px dashed #333;border-radius:12px;background:#fff;padding:13px 8px;text-align:center;font-weight:900}
.goal-stage-grid .rowhead{background:#eef3e9}
.goal-stage-grid .stage-label{background:#fffaf0}
.goal-list{padding:18px 18px 46px}
.goal-row{display:grid;grid-template-columns:70px 1fr;align-items:center;min-height:76px;border:2px solid #111;border-bottom:0;position:relative;z-index:2;background:#fffaf0}
.goal-row:last-child{border-bottom:2px solid #111}
.goal-num{width:52px;height:52px;border-radius:50%;border:3px solid #111;display:grid;place-items:center;margin:auto;font-weight:1000;font-size:24px}
.goal-text{font-size:clamp(18px,2.4vw,27px);font-weight:650;padding:10px 16px}
.n0{background:#f7b4c2}.n1{background:#f4a861}.n2{background:#f2d958}.n3{background:#97dca6}.n4{background:#9bd6ef}.n5{background:#d4a7eb}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;position:relative;z-index:3}
.page-no{text-align:right;font-size:23px;font-weight:900;margin-top:12px;position:relative;z-index:3}
.stage-list{display:grid;gap:14px}
.stage-btn{
  width:100%;background:#fffaf0;border:3px solid #111;border-left:18px solid var(--c);border-radius:20px;
  padding:20px 24px;text-align:left;font-weight:1000;font-size:clamp(23px,3.5vw,36px);cursor:pointer
}
.stage-screen .title-card{border-left:18px solid var(--c)}
.stage-label{display:inline-block;position:relative;z-index:3;background:var(--pink);border:2px solid #111;border-radius:11px;padding:5px 13px;font-weight:1000;font-size:22px;margin:0 0 6px}
.stage-panel{position:relative;background:#fffaf0;border:3px solid #111;border-radius:22px;padding:20px 24px;margin-bottom:18px}
.stage-panel::after{content:"";position:absolute;inset:9px;border:2px dashed #555;border-radius:14px;pointer-events:none}
.stage-panel ul{position:relative;z-index:2;padding-left:26px}
.stage-panel li{font-size:clamp(17px,2.3vw,24px);line-height:1.45;margin:4px 0}
.stage-panel li::marker{color:#df3440}
.scenario-card{
  width:100%;background:#fffaf0;border:3px solid #111;border-radius:22px;padding:26px 28px;margin-bottom:18px;
  font-size:clamp(23px,3.5vw,36px);font-weight:1000;text-align:left;position:relative
}
.scenario-card::after{content:"";position:absolute;inset:9px;border:2px dashed #555;border-radius:14px;pointer-events:none}
.note{position:relative;z-index:2;border-left:5px solid #333;padding-left:12px;margin-top:12px;font-size:17px}
@media(max-width:700px){
  :root{--band-h:88px}
  .band{
    background-image:
      radial-gradient(circle at 56px 22px,#fff 0 10px,transparent 11px),
      radial-gradient(circle at 18px 55px,#fff 0 10px,transparent 11px);
    background-size:78px 68px
  }
  .screen{padding:calc(var(--band-h) + 24px) 12px calc(var(--band-h) + 24px)}
  .home-grid{gap:26px;width:96%}
  .home-tile{min-height:180px;padding:22px}
  .home-logo{width:96%;margin-bottom:24px}
  .cols,.goals12{grid-template-columns:1fr}
  .method-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goal-stage-grid{grid-template-columns:1fr}
  .goal-stage-grid .stage-label{display:none}
}
</style>
</head>
<body>
<div class="band top"></div>
<div class="band bottom"></div>
